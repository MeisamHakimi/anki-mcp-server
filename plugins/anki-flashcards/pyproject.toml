# Lock for the plugin's MCP server (`uvx anki-mcp-server==0.2.0` in .mcp.json): uv.lock, next to this file,
# records the exact version, PyPI source and hashes of the server and every dependency.
# Regenerate after changing the version: uv lock --project plugins/anki-flashcards
[project]
name = "anki-flashcards-plugin"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["anki-mcp-server==0.2.0"]

[tool.uv]
package = false
# Platforms Claude Code and Cowork run on; keeps the lockfile small.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
