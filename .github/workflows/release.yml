name: Release

# Runs when a GitHub release is published (tag vX.Y.Z): publishes the package to PyPI with trusted publishing
# (no API token stored anywhere) and attaches the Claude Desktop extension and the bridge add-on to the release.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach files to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check that the tag, package, plugin and launcher versions agree
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match version $v"; exit 1; }
          grep -q "\"anki-mcp-server==$v\"" plugins/anki-flashcards/.mcp.json || { echo ".mcp.json isn't pinned to $v"; exit 1; }
          grep -q "\"version\": \"$v\"" plugins/anki-flashcards/.claude-plugin/plugin.json || { echo "plugin.json version isn't $v"; exit 1; }
      - run: python -m pip install build -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/build_addon.py
      - run: python scripts/build_mcpb.py
      - name: Attach the desktop extension and the bridge add-on to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/anki-mcp-server.mcpb dist/anki_mcp_bridge.ankiaddon --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anki-mcp-server/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
