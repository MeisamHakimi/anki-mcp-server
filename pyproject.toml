[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "anki-mcp-server"
version = "0.1.0"
description = "MCP server for Anki (via AnkiConnect): add, import, search, edit and organize notes and decks from Claude or any MCP client."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "MeisamHakimi" }]
keywords = ["anki", "ankiconnect", "mcp", "model-context-protocol", "claude", "flashcards", "spaced-repetition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "gTTS>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
anki-mcp-server = "anki_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/MeisamHakimi/anki-mcp-server"
Issues = "https://github.com/MeisamHakimi/anki-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
